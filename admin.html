<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - Solar Shop</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; padding: 30px; margin: 0; }
        .container { background-color: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; max-width: 600px; }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"], input[type="email"], input[type="password"], input[type="file"], textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: inherit; }
        button { width: 100%; padding: 10px; background-color: #e67e22; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        button:hover { background-color: #d35400; }
        .admin-item { display: flex; justify-content: space-between; align-items: center; background: #f9f9f9; padding: 10px; margin-bottom: 10px; border-radius: 4px; border: 1px solid #ddd; }
        .admin-item img { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; }
        .btn-delete { background-color: #e74c3c; width: auto; padding: 5px 15px; font-size: 14px; margin: 0; }
        .btn-delete:hover { background-color: #c0392b; }
        #dashboard-section { display: none; }
        .section-header { background-color: #333; color: white; padding: 10px; border-radius: 4px; margin-top: 40px; text-align: center; font-size: 18px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- SECTION 1 : LOGIN -->
        <div id="login-section">
            <h2>Secure Login</h2>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="email@client.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>
            <button id="login-btn">Log In</button>
            <p id="login-error" style="color: red; text-align: center; display: none;">Incorrect credentials.</p>
        </div>

        <!-- SECTION 2 : DASHBOARD -->
        <div id="dashboard-section">
            
            <div class="section-header">1. Manage Shop Items</div>
            
            <div class="form-group" style="margin-top: 20px;">
                <label>Item Title</label>
                <input type="text" id="titre">
            </div>
            <div class="form-group">
                <label>Price (GHS )</label>
                <input type="number" id="prix">
            </div>
            <div class="form-group">
                <label>Equipment Category</label>
                <select id="categorie" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
                    <option value="Panneaux Solaires">Solar Panels</option>
                    <option value="Onduleurs Hybrides">Hybrid Inverters</option>
                    <option value="Batteries">Storage Batteries</option>
                    <option value="Accessoires">Accessories & Cables</option>
                </select>
            </div>
            <div class="form-group">
                <label>Image</label>
                <input type="file" id="image" accept="image/*">
            </div>
            <button id="add-item-btn">Publish Item</button>
            <p id="success-msg" style="color: green; text-align: center; display: none;">Item published!</p>

            <div id="admin-list" style="margin-top: 20px;"></div>

            <!-- SECTION 3 : EDIT HOME TEXTS -->
            <div class="section-header">2. Edit Home Page Texts</div>
            
            <div style="margin-top: 20px;">
                <div class="form-group">
                    <label>Title 1</label>
                    <input type="text" id="titre1">
                    <label>Text 1</label>
                    <textarea id="texte1" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>Title 2</label>
                    <input type="text" id="titre2">
                    <label>Text 2</label>
                    <textarea id="texte2" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>Title 3</label>
                    <input type="text" id="titre3">
                    <label>Text 3</label>
                    <textarea id="texte3" rows="3"></textarea>
                </div>
                <button id="save-texts-btn" style="background-color: #27ae60;">Update Texts</button>
                <p id="text-success-msg" style="color: green; text-align: center; display: none;">Texts updated!</p>
            </div>

            <!-- SECTION 4 : NAVIGATION & FOOTER -->
            <div class="section-header">3. Navigation & Footer</div>
            <div style="margin-top: 20px;">
                <div class="form-group">
                    <label>Menu 1 (Home)</label>
                    <input type="text" id="nav-home">
                </div>
                <div class="form-group">
                    <label>Menu 2 (Shop)</label>
                    <input type="text" id="nav-shop">
                </div>
                <div class="form-group">
                    <label>Menu 3 (About)</label>
                    <input type="text" id="nav-about">
                </div>
                <div class="form-group">
                    <label>Footer Text</label>
                    <input type="text" id="footer-text">
                </div>
                <button id="save-global-btn" style="background-color: #27ae60;">Update Menu & Footer</button>
                <p id="global-success-msg" style="color: green; text-align: center; display: none;">Elements updated!</p>
            </div>

            <hr style="margin: 20px 0;">
            <div class="form-group">
                <label>Home Background Image (Hero)</label>
                <input type="file" id="hero-image-input" accept="image/*">
                <button id="save-hero-img-btn" style="background-color: #2980b9;">Change Background Image</button>
            </div>

            <br>
            <button id="logout-btn" style="background-color: #7f8c8d; margin-top: 40px;">Log Out</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
        import { getDatabase, ref as dbRef, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA8CtduFC3q0j8SezpmTxCUSZbu-NBJeyM",
            authDomain: "k-big-solar-energie.firebaseapp.com",
            databaseURL: "https://k-big-solar-energie-default-rtdb.firebaseio.com",
            projectId: "k-big-solar-energie",
            storageBucket: "k-big-solar-energie.firebasestorage.app",
            messagingSenderId: "678658108783",
            appId: "1:678658108783:web:5ac94bc5f426db6e27cc9a"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const IMGBB_API_KEY = "fb18d4c248db51cf6f9af93c587808fa";

        const loginSection = document.getElementById('login-section');
        const dashboardSection = document.getElementById('dashboard-section');
        const loginBtn = document.getElementById('login-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const adminList = document.getElementById('admin-list');

        // Authentication
        loginBtn.addEventListener('click', () => {
            signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value)
                .then(() => {
                    loginSection.style.display = 'none';
                    dashboardSection.style.display = 'block';
                })
                .catch(() => document.getElementById('login-error').style.display = 'block');
        });

        logoutBtn.addEventListener('click', () => {
            signOut(auth).then(() => {
                loginSection.style.display = 'block';
                dashboardSection.style.display = 'none';
            });
        });

        // 1. MANAGE ITEMS
        onValue(dbRef(db, 'articles_solaires'), (snapshot) => {
            adminList.innerHTML = "";
            if (snapshot.exists()) {
                const data = snapshot.val();
                Object.keys(data).forEach((key) => {
                    const article = data[key];
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'admin-item';
                    itemDiv.innerHTML = `
                        <img src="${article.imageUrl}" alt="">
                        <span style="flex-grow: 1; margin: 0 15px;"><strong>${article.titre}</strong><br>${article.prix} FCFA</span>
                        <button class="btn-delete" data-id="${key}">X</button>
                    `;
                    adminList.appendChild(itemDiv);
                });

                document.querySelectorAll('.btn-delete').forEach(button => {
                    button.addEventListener('click', async (e) => {
                        if (confirm("Delete this item?")) {
                            await remove(dbRef(db, 'articles_solaires/' + e.target.getAttribute('data-id')));
                        }
                    });
                });
            }
        });

        document.getElementById('add-item-btn').addEventListener('click', async () => {
            const titre = document.getElementById('titre').value;
            const prix = document.getElementById('prix').value;
            const file = document.getElementById('image').files[0];
            if (!titre || !prix || !file) return alert("Please fill in all fields!");
            
            document.getElementById('add-item-btn').innerText = "Uploading...";
            try {
                const formData = new FormData(); formData.append("image", file);
                const response = await fetch("https://api.imgbb.com/1/upload?key=" + IMGBB_API_KEY, { method: "POST", body: formData });
                const data = await response.json();
                
                await push(dbRef(db, 'articles_solaires'), { titre: titre, prix: parseFloat(prix), categorie: document.getElementById('categorie').value, imageUrl: data.data.url, dateAjout: new Date().toISOString()});
                document.getElementById('titre').value = ''; document.getElementById('prix').value = '';
                document.getElementById('success-msg').style.display = 'block';
                setTimeout(() => document.getElementById('success-msg').style.display = 'none', 3000);
            } catch (e) { alert("Error uploading item."); }
            document.getElementById('add-item-btn').innerText = "Publish Item";
        });

        // 2. EDIT TEXTS
        const textsRef = dbRef(db, 'contenu_pages/accueil');
        
        onValue(textsRef, (snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.val();
                document.getElementById('titre1').value = data.titre1 || "Power Your Life With Clean Energy";
                document.getElementById('texte1').value = data.texte1 || "Discover quality solar products...";
                document.getElementById('titre2').value = data.titre2 || "Why Choose Us?";
                document.getElementById('texte2').value = data.texte2 || "We offer quality products...";
                document.getElementById('titre3').value = data.titre3 || "Welcome to K.BIG";
                document.getElementById('texte3').value = data.texte3 || "K.BIG Solar Energy is dedicated...";
            }
        });

        document.getElementById('save-texts-btn').addEventListener('click', async () => {
            await update(textsRef, {
                titre1: document.getElementById('titre1').value,
                texte1: document.getElementById('texte1').value,
                titre2: document.getElementById('titre2').value,
                texte2: document.getElementById('texte2').value,
                titre3: document.getElementById('titre3').value,
                texte3: document.getElementById('texte3').value
            });
            document.getElementById('text-success-msg').style.display = 'block';
            setTimeout(() => document.getElementById('text-success-msg').style.display = 'none', 3000);
        });

        // 3. NAVIGATION & FOOTER
        const globalRef = dbRef(db, 'contenu_pages/global');
        
        onValue(globalRef, (snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.val();
                document.getElementById('nav-home').value = data.navHome || "Home";
                document.getElementById('nav-shop').value = data.navShop || "Shop";
                document.getElementById('nav-about').value = data.navAbout || "About";
                document.getElementById('footer-text').value = data.footerText || "© 2026 K.BIG SOLAR ENERGY";
            }
        });

        document.getElementById('save-global-btn').addEventListener('click', async () => {
            await update(globalRef, {
                navHome: document.getElementById('nav-home').value,
                navShop: document.getElementById('nav-shop').value,
                navAbout: document.getElementById('nav-about').value,
                footerText: document.getElementById('footer-text').value
            });
            document.getElementById('global-success-msg').style.display = 'block';
            setTimeout(() => document.getElementById('global-success-msg').style.display = 'none', 3000);
        });

        // 4. BACKGROUND IMAGE
        document.getElementById('save-hero-img-btn').addEventListener('click', async () => {
            const file = document.getElementById('hero-image-input').files[0];
            if (!file) return alert("Please select an image!");
            
            document.getElementById('save-hero-img-btn').innerText = "Uploading...";
            try {
                const formData = new FormData(); 
                formData.append("image", file);
                const response = await fetch("https://api.imgbb.com/1/upload?key=" + IMGBB_API_KEY, { method: "POST", body: formData });
                const data = await response.json();
                
                await update(dbRef(db, 'contenu_pages/global'), { heroImage: data.data.url });
                alert("Background image updated successfully!");
            } catch (e) { 
                alert("Error uploading image."); 
            }
            document.getElementById('save-hero-img-btn').innerText = "Change Background Image";
        });
    </script>
</body>
</html>
