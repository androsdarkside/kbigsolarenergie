<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - Boutique Solaire</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            padding: 50px;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        h2 { text-align: center; color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"], input[type="email"], input[type="password"], input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #e67e22; 
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover { background-color: #d35400; }
        #dashboard-section { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <!-- SECTION 1 : CONNEXION -->
        <div id="login-section">
            <h2>Connexion Sécurisée</h2>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="email@client.com">
            </div>
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>
            <button id="login-btn">Se connecter</button>
            <p id="login-error" style="color: red; text-align: center; display: none;">Identifiants incorrects.</p>
        </div>

        <!-- SECTION 2 : TABLEAU DE BORD -->
        <div id="dashboard-section">
            <h2>Ajouter un équipement</h2>
            <div class="form-group">
                <label for="titre">Titre de l'article (ex: Panneau 400W)</label>
                <input type="text" id="titre" required>
            </div>
            <div class="form-group">
                <label for="prix">Prix (FCFA)</label>
                <input type="number" id="prix" required>
            </div>
            <div class="form-group">
                <label for="image">Image de l'article</label>
                <input type="file" id="image" accept="image/*" required>
            </div>
            <button id="add-item-btn">Publier l'article</button>
            <p id="success-msg" style="color: green; text-align: center; display: none;">Article ajouté avec succès !</p>

            <br>
            <button id="logout-btn" style="background-color: #7f8c8d; margin-top: 20px;">Se déconnecter</button>
        </div>
    </div>

    <script type="module">
        // Importations Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        // Configuration Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyA8CtduFC3q0j8SezpmTxCUSZbu-NBJeyM",
            authDomain: "k-big-solar-energie.firebaseapp.com",
            projectId: "k-big-solar-energie",
            messagingSenderId: "678658108783",
            appId: "1:678658108783:web:5ac94bc5f426db6e27cc9a"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Clé API ImgBB (sécurisée avec des guillemets simples)
        const IMGBB_API_KEY = "fb18d4c248db51cf6f9af93c587808fa";

        // Éléments HTML
        const loginSection = document.getElementById('login-section');
        const dashboardSection = document.getElementById('dashboard-section');
        const loginBtn = document.getElementById('login-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const loginError = document.getElementById('login-error');
        const addItemBtn = document.getElementById('add-item-btn');
        const successMsg = document.getElementById('success-msg');

        // Connexion
        loginBtn.addEventListener('click', () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            loginBtn.innerText = "Connexion...";

            signInWithEmailAndPassword(auth, email, password)
                .then(() => {
                    loginSection.style.display = 'none';
                    dashboardSection.style.display = 'block';
                    loginError.style.display = 'none';
                    loginBtn.innerText = "Se connecter";
                })
                .catch((error) => {
                    loginError.style.display = 'block';
                    loginBtn.innerText = "Se connecter";
                });
        });

        // Déconnexion
        logoutBtn.addEventListener('click', () => {
            signOut(auth).then(() => {
                loginSection.style.display = 'block';
                dashboardSection.style.display = 'none';
                document.getElementById('email').value = '';
                document.getElementById('password').value = '';
            });
        });

        // Ajout d'article via ImgBB
        addItemBtn.addEventListener('click', async () => {
            const titre = document.getElementById('titre').value;
            const prix = document.getElementById('prix').value;
            const imageFile = document.getElementById('image').files[0];

            if (!titre || !prix || !imageFile) {
                alert("Veuillez remplir tous les champs !");
                return;
            }

            addItemBtn.innerText = "Publication en cours... Veuillez patienter.";
            addItemBtn.disabled = true;

            try {
                // ÉTAPE 1 : Envoi à ImgBB
                const formData = new FormData();
                formData.append("image", imageFile);

                // Construction de l'URL sans caractères spéciaux pour éviter les bugs
                const urlUpload = "https://api.imgbb.com/1/upload?key=" + IMGBB_API_KEY;

                const response = await fetch(urlUpload, {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();

                if (!data.success) {
                    throw new Error("Impossible d'envoyer l'image.");
                }

                const urlImage = data.data.url;

                // ÉTAPE 2 : Enregistrement dans Firestore
                await addDoc(collection(db, "articles_solaires"), {
                    titre: titre,
                    prix: parseFloat(prix),
                    imageUrl: urlImage,
                    dateAjout: new Date()
                });

                alert("Succès ! L'article est en ligne.");
                
                document.getElementById('titre').value = '';
                document.getElementById('prix').value = '';
                document.getElementById('image').value = '';
                
                successMsg.style.display = 'block';
                setTimeout(() => { successMsg.style.display = 'none'; }, 3000);

            } catch (error) {
                alert("Une erreur s'est produite : " + error.message);
            } finally {
                addItemBtn.innerText = "Publier l'article";
                addItemBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
