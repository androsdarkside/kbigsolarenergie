<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - Boutique Solaire</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; padding: 30px; margin: 0; }
        .container { background-color: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; max-width: 600px; }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"], input[type="email"], input[type="password"], input[type="file"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #e67e22; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #d35400; }
        
        /* Style pour la liste de gestion des articles */
        .admin-item { display: flex; justify-content: space-between; align-items: center; background: #f9f9f9; padding: 10px; margin-bottom: 10px; border-radius: 4px; border: 1px solid #ddd; }
        .admin-item img { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; }
        .btn-delete { background-color: #e74c3c; width: auto; padding: 5px 15px; font-size: 14px; }
        .btn-delete:hover { background-color: #c0392b; }

        #dashboard-section { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <!-- SECTION 1 : CONNEXION -->
        <div id="login-section">
            <h2>Connexion Sécurisée</h2>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="email@client.com">
            </div>
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>
            <button id="login-btn">Se connecter</button>
            <p id="login-error" style="color: red; text-align: center; display: none;">Identifiants incorrects.</p>
        </div>

        <!-- SECTION 2 : TABLEAU DE BORD -->
        <div id="dashboard-section">
            <h2>Ajouter un équipement</h2>
            <div class="form-group">
                <label for="titre">Titre de l'article</label>
                <input type="text" id="titre" required>
            </div>
            <div class="form-group">
                <label for="prix">Prix (FCFA)</label>
                <input type="number" id="prix" required>
            </div>
            <div class="form-group">
                <label for="image">Image de l'article</label>
                <input type="file" id="image" accept="image/*" required>
            </div>
            <button id="add-item-btn">Publier l'article</button>
            <p id="success-msg" style="color: green; text-align: center; display: none; margin-top: 10px;">Article ajouté avec succès !</p>

            <hr style="margin: 30px 0;">

            <h2>Gérer / Supprimer les articles</h2>
            <div id="admin-list">
                <!-- La liste des articles modifiables/supprimables s'affiche ici -->
            </div>

            <button id="logout-btn" style="background-color: #7f8c8d; margin-top: 20px;">Se déconnecter</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
        import { getDatabase, ref as dbRef, push, onValue, remove } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA8CtduFC3q0j8SezpmTxCUSZbu-NBJeyM",
            authDomain: "k-big-solar-energie.firebaseapp.com",
            databaseURL: "https://k-big-solar-energie-default-rtdb.firebaseio.com",
            projectId: "k-big-solar-energie",
            storageBucket: "k-big-solar-energie.firebasestorage.app",
            messagingSenderId: "678658108783",
            appId: "1:678658108783:web:5ac94bc5f426db6e27cc9a"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        
        const IMGBB_API_KEY = "fb18d4c248db51cf6f9af93c587808fa";

        const loginSection = document.getElementById('login-section');
        const dashboardSection = document.getElementById('dashboard-section');
        const loginBtn = document.getElementById('login-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const loginError = document.getElementById('login-error');
        const addItemBtn = document.getElementById('add-item-btn');
        const successMsg = document.getElementById('success-msg');
        const adminList = document.getElementById('admin-list');

        // Connexion
        loginBtn.addEventListener('click', () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            signInWithEmailAndPassword(auth, email, password)
                .then(() => {
                    loginSection.style.display = 'none';
                    dashboardSection.style.display = 'block';
                    loginError.style.display = 'none';
                })
                .catch(() => { loginError.style.display = 'block'; });
        });

        // Déconnexion
        logoutBtn.addEventListener('click', () => {
            signOut(auth).then(() => {
                loginSection.style.display = 'block';
                dashboardSection.style.display = 'none';
            });
        });

        // Charger et afficher la liste des articles dans l'admin avec bouton de suppression
        const articlesRef = dbRef(db, 'articles_solaires');
        onValue(articlesRef, (snapshot) => {
            adminList.innerHTML = "";
            if (snapshot.exists()) {
                const data = snapshot.val();
                Object.keys(data).forEach((key) => {
                    const article = data[key];
                    
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'admin-item';
                    itemDiv.innerHTML = `
                        <img src="${article.imageUrl}" alt="">
                        <span style="flex-grow: 1; margin: 0 15px; text-align: left;"><strong>${article.titre}</strong><br>${article.prix} FCFA</span>
                        <button class="btn-delete" data-id="${key}">Supprimer</button>
                    `;
                    adminList.appendChild(itemDiv);
                });

                // Attacher l'action de suppression à chaque bouton généré
                document.querySelectorAll('.btn-delete').forEach(button => {
                    button.addEventListener('click', async (e) => {
                        const articleId = e.target.getAttribute('data-id');
                        if (confirm("Voulez-vous vraiment supprimer cet article ?")) {
                            try {
                                await remove(dbRef(db, 'articles_solaires/' + articleId));
                                alert("Article supprimé avec succès !");
                            } catch (error) {
                                alert("Erreur lors de la suppression : " + error.message);
                            }
                        }
                    });
                });
            } else {
                adminList.innerHTML = '<p style="text-align: center; color: #777;">Aucun article à gérer.</p>';
            }
        });

        // Ajout d'article
        addItemBtn.addEventListener('click', async () => {
            const titre = document.getElementById('titre').value;
            const prix = document.getElementById('prix').value;
            const imageFile = document.getElementById('image').files[0];

            if (!titre || !prix || !imageFile) {
                alert("Veuillez remplir tous les champs !");
                return;
            }

            addItemBtn.innerText = "Publication en cours...";
            addItemBtn.disabled = true;

            try {
                const formData = new FormData();
                formData.append("image", imageFile);
                const response = await fetch("https://api.imgbb.com/1/upload?key=" + IMGBB_API_KEY, { method: "POST", body: formData });
                const data = await response.json();

                if (!data.success) throw new Error("Échec de l'envoi de l'image.");
                
                await push(articlesRef, {
                    titre: titre,
                    prix: parseFloat(prix),
                    imageUrl: data.data.url,
                    dateAjout: new Date().toISOString()
                });

                document.getElementById('titre').value = '';
                document.getElementById('prix').value = '';
                document.getElementById('image').value = '';
                successMsg.style.display = 'block';
                setTimeout(() => { successMsg.style.display = 'none'; }, 3000);
            } catch (error) {
                alert("Erreur : " + error.message);
            } finally {
                addItemBtn.innerText = "Publier l'article";
                addItemBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
