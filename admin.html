<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - K.BIG Solar Energy</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff5100;
            --primary-hover: #e64a00;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .admin-wrapper {
            width: 100%;
            max-width: 850px;
        }

        /* --- SECTION CONNEXION --- */
        #login-section {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
            border: 1px solid var(--border);
            max-width: 450px;
            margin: 80px auto;
            text-align: center;
        }

        #login-section h2 {
            margin-bottom: 25px;
            font-weight: 700;
            color: var(--text-main);
        }

        /* --- TABLEAU DE BORD --- */
        #dashboard-section {
            display: none;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            background: var(--card-bg);
            padding: 20px 30px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            border: 1px solid var(--border);
        }

        .dashboard-header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .btn-logout {
            background-color: #f1f5f9;
            color: #475569;
            border: none;
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-logout:hover {
            background-color: #fee2e2;
            color: #ef4444;
        }

        /* --- BOUTONS DE NAVIGATION (ONGLETS) --- */
        .admin-nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            background: var(--card-bg);
            padding: 10px;
            border-radius: 16px;
            border: 1px solid var(--border);
            overflow-x: auto;
        }

        .tab-btn {
            flex: 1;
            padding: 12px 16px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.95rem;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .tab-btn:hover {
            background: #f1f5f9;
            color: var(--text-main);
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(255, 81, 0, 0.25);
        }

        /* --- SECTIONS DE CONTENU (MASQUÉES PAR DÉFAUT) --- */
        .admin-section-content {
            display: none;
        }

        .admin-section-content.active-section {
            display: block;
        }

        /* --- CARTES DE FORMULAIRES --- */
        .admin-card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            border: 1px solid var(--border);
            margin-bottom: 30px;
        }

        .admin-card h2 {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--text-main);
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 12px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-main);
        }

        input[type="text"], 
        input[type="number"], 
        input[type="email"], 
        input[type="password"], 
        input[type="file"], 
        textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 0.95rem;
            background-color: #f8fafc;
            outline: none;
            transition: all 0.2s;
        }

        input:focus, textarea:focus {
            border-color: var(--primary);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(255, 81, 0, 0.08);
        }

        button.btn-primary {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(255, 81, 0, 0.2);
        }

        button.btn-primary:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        /* --- BARRE DE RECHERCHE DANS LA LISTE ADMIN --- */
        .admin-search-box {
            margin-bottom: 15px;
        }

        /* --- LISTE DES ARTICLES --- */
        .admin-item-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 15px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .admin-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8fafc;
            padding: 12px 16px;
            border-radius: 14px;
            border: 1px solid var(--border);
        }

        .admin-item img {
            width: 55px;
            height: 55px;
            object-fit: cover;
            border-radius: 10px;
        }

        .item-info {
            flex-grow: 1;
            margin-left: 20px;
        }

        .item-info h4 {
            font-size: 1rem;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .item-info span {
            font-size: 0.85rem;
            color: var(--text-muted);
            background: #e2e8f0;
            padding: 2px 8px;
            border-radius: 6px;
        }

        .btn-delete {
            background-color: #fee2e2;
            color: #ef4444;
            border: none;
            padding: 8px 14px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-delete:hover {
            background-color: #ef4444;
            color: white;
        }

        .success-alert {
            background-color: #dcfce7;
            color: #166534;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 600;
            margin-top: 15px;
            display: none;
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .admin-nav-tabs {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="admin-wrapper">
        
        <!-- SECTION 1 : CONNEXION -->
        <div id="login-section">
            <h2>K.BIG Admin Portal</h2>
            <div class="form-group">
                <label>Admin Email</label>
                <input type="email" id="email" placeholder="admin@kbigsolar.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>
            <button id="login-btn" class="btn-primary">Secure Login</button>
            <p id="login-error" style="color: #ef4444; font-size: 0.85rem; margin-top: 15px; display: none;">Incorrect credentials. Please try again.</p>
        </div>

        <!-- SECTION 2 : TABLEAU DE BORD -->
        <div id="dashboard-section">
            
            <div class="dashboard-header">
                <h1>Control Panel</h1>
                <button id="logout-btn" class="btn-logout">Log Out</button>
            </div>

            <!-- BOUTONS DE NAVIGATION PAR ONGLET -->
            <div class="admin-nav-tabs">
                <button class="tab-btn active" onclick="switchTab('shop-tab', event)">📦 Shop Manager</button>
                <button class="tab-btn" onclick="switchTab('texts-tab', event)">✏️ Home Texts</button>
                <button class="tab-btn" onclick="switchTab('global-tab', event)">⚙️ Global & Design</button>
            </div>

            <!-- ONGLET 1 : GESTION DE LA BOUTIQUE & RECHERCHE -->
            <div id="shop-tab" class="admin-section-content active-section">
                <div class="admin-card">
                    <h2>Add New Equipment</h2>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Item Title</label>
                            <input type="text" id="titre" placeholder="e.g. Solar Panel 600W">
                        </div>
                        <div class="form-group">
                            <label>Price (FCFA)</label>
                            <input type="number" id="prix" placeholder="e.g. 125000">
                        </div>
                        <div class="form-group full-width">
                            <label>Category (Select or type custom)</label>
                            <input type="text" id="categorie" list="category-list" placeholder="Select or type category...">
                            <datalist id="category-list">
                                <option value="Solar Panels">
                                <option value="Hybrid Inverters">
                                <option value="Storage Batteries">
                                <option value="Accessories & Cables">
                            </datalist>
                        </div>
                        <div class="form-group full-width">
                            <label>Product Image</label>
                            <input type="file" id="image" accept="image/*">
                        </div>
                    </div>
                    <button id="add-item-btn" class="btn-primary">Publish Equipment</button>
                    <div id="success-msg" class="success-alert">Equipment published successfully!</div>
                </div>

                <div class="admin-card">
                    <h2>Manage Existing Items</h2>
                    <!-- Barre de recherche pour l'admin -->
                    <div class="form-group admin-search-box">
                        <input type="text" id="adminSearchInput" placeholder="Search added items by title or category...">
                    </div>
                    <div id="admin-list" class="admin-item-list"></div>
                </div>
            </div>

            <!-- ONGLET 2 : TEXTES DE L'ACCUEIL -->
            <div id="texts-tab" class="admin-section-content">
                <div class="admin-card">
                    <h2>Edit Home Page Content</h2>
                    <div class="form-group">
                        <label>Title 1 (Hero)</label>
                        <input type="text" id="titre1">
                    </div>
                    <div class="form-group">
                        <label>Text 1 (Hero)</label>
                        <textarea id="texte1" rows="2"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Title 2</label>
                        <input type="text" id="titre2">
                    </div>
                    <div class="form-group">
                        <label>Text 2</label>
                        <textarea id="texte2" rows="2"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Title 3</label>
                        <input type="text" id="titre3">
                    </div>
                    <div class="form-group">
                        <label>Text 3</label>
                        <textarea id="texte3" rows="2"></textarea>
                    </div>
                    <button id="save-texts-btn" class="btn-primary" style="background-color: #10b981;">Save Home Texts</button>
                    <div id="text-success-msg" class="success-alert">Home texts updated successfully!</div>
                </div>
            </div>

            <!-- ONGLET 3 : PARAMÈTRES GLOBAUX & DESIGN -->
            <div id="global-tab" class="admin-section-content">
                <div class="admin-card">
                    <h2>Global Settings (Menu, Footer & Visuals)</h2>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Menu 1 (Home)</label>
                            <input type="text" id="nav-home">
                        </div>
                        <div class="form-group">
                            <label>Menu 2 (Shop)</label>
                            <input type="text" id="nav-shop">
                        </div>
                        <div class="form-group">
                            <label>Menu 3 (About)</label>
                            <input type="text" id="nav-about">
                        </div>
                        <div class="form-group">
                            <label>Footer Text</label>
                            <input type="text" id="footer-text">
                        </div>
                    </div>
                    <button id="save-global-btn" class="btn-primary" style="background-color: #10b981;">Save Global Settings</button>
                    <div id="global-success-msg" class="success-alert">Global settings updated successfully!</div>

                    <hr style="margin: 30px 0; border: none; border-top: 1px solid var(--border);">

                    <div class="form-group">
                        <label>Update Website Logo</label>
                        <input type="file" id="logo-image-input" accept="image/*">
                    </div>
                    <button id="save-logo-btn" class="btn-primary" style="background-color: #3b82f6;">Upload New Logo</button>

                    <hr style="margin: 30px 0; border: none; border-top: 1px solid var(--border);">

                    <div class="form-group">
                        <label>Update Home Background Image (Hero)</label>
                        <input type="file" id="hero-image-input" accept="image/*">
                    </div>
                    <button id="save-hero-img-btn" class="btn-primary" style="background-color: #3b82f6;">Upload New Hero Background</button>
                </div>
            </div>

        </div>
    </div>

    <!-- Script de gestion des onglets (Global function) -->
    <script>
        function switchTab(tabId, event) {
            // Cacher tous les contenus d'onglets
            document.querySelectorAll('.admin-section-content').forEach(content => {
                content.classList.remove('active-section');
            });
            // Retirer la classe active de tous les boutons
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            // Afficher l'onglet ciblé et activer son bouton
            document.getElementById(tabId).classList.add('active-section');
            event.currentTarget.classList.add('active');
        }
    </script>

    <!-- Script Firebase & Admin Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
        import { getDatabase, ref as dbRef, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA8CtduFC3q0j8SezpmTxCUSZbu-NBJeyM",
            authDomain: "k-big-solar-energie.firebaseapp.com",
            databaseURL: "https://k-big-solar-energie-default-rtdb.firebaseio.com",
            projectId: "k-big-solar-energie",
            storageBucket: "k-big-solar-energie.firebasestorage.app",
            messagingSenderId: "678658108783",
            appId: "1:678658108783:web:5ac94bc5f426db6e27cc9a"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const IMGBB_API_KEY = "fb18d4c248db51cf6f9af93c587808fa";

        const loginSection = document.getElementById('login-section');
        const dashboardSection = document.getElementById('dashboard-section');
        const adminList = document.getElementById('admin-list');
        const adminSearchInput = document.getElementById('adminSearchInput');

        let allAdminArticles = [];

        // Authentification
        document.getElementById('login-btn').addEventListener('click', () => {
            signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value)
                .then(() => {
                    loginSection.style.display = 'none';
                    dashboardSection.style.display = 'block';
                })
                .catch(() => document.getElementById('login-error').style.display = 'block');
        });

        document.getElementById('logout-btn').addEventListener('click', () => {
            signOut(auth).then(() => {
                loginSection.style.display = 'block';
                dashboardSection.style.display = 'none';
            });
        });

        // Fonction d'affichage de la liste admin avec filtre de recherche
        function renderAdminList(filterText = "") {
            adminList.innerHTML = "";
            const filtered = allAdminArticles.filter(item => {
                const matchTitle = item.titre.toLowerCase().includes(filterText.toLowerCase());
                const matchCategory = (item.categorie || "").toLowerCase().includes(filterText.toLowerCase());
                return matchTitle || matchCategory;
            });

            if (filtered.length > 0) {
                filtered.forEach((article) => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'admin-item';
                    itemDiv.innerHTML = `
                        <img src="${article.imageUrl}" alt="">
                        <div class="item-info">
                            <h4>${article.titre}</h4>
                            <span>${article.categorie || "General"}</span> — <strong>${Number(article.prix).toLocaleString('fr-FR')} FCFA</strong>
                        </div>
                        <button class="btn-delete" data-id="${article.id}">Delete</button>
                    `;
                    adminList.appendChild(itemDiv);
                });

                // Activer les boutons de suppression
                document.querySelectorAll('.btn-delete').forEach(button => {
                    button.addEventListener('click', async (e) => {
                        if (confirm("Are you sure you want to delete this item?")) {
                            await remove(dbRef(db, 'articles_solaires/' + e.target.getAttribute('data-id')));
                        }
                    });
                });
            } else {
                adminList.innerHTML = '<p style="text-align: center; color: var(--text-muted); font-size: 0.9rem; padding: 10px;">No matching items found.</p>';
            }
        }

        // Récupération des articles depuis Firebase
        onValue(dbRef(db, 'articles_solaires'), (snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.val();
                allAdminArticles = Object.keys(data).map(key => ({
                    id: key,
                    ...data[key]
                }));
                renderAdminList(adminSearchInput.value);
            } else {
                allAdminArticles = [];
                adminList.innerHTML = '<p style="text-align: center; color: var(--text-muted); font-size: 0.9rem; padding: 10px;">No items published yet.</p>';
            }
        });

        // Recherche en direct dans l'admin
        adminSearchInput.addEventListener('input', (e) => {
            renderAdminList(e.target.value);
        });

        // Publication d'un article
        document.getElementById('add-item-btn').addEventListener('click', async () => {
            const titre = document.getElementById('titre').value;
            const prix = document.getElementById('prix').value;
            const categorie = document.getElementById('categorie').value || "Other Equipment";
            const file = document.getElementById('image').files[0];

            if (!titre || !prix || !file) return alert("Please fill in all required fields!");
            
            const btn = document.getElementById('add-item-btn');
            btn.innerText = "Uploading to Cloud...";
            btn.disabled = true;

            try {
                const formData = new FormData(); 
                formData.append("image", file);
                const response = await fetch("https://api.imgbb.com/1/upload?key=" + IMGBB_API_KEY, { method: "POST", body: formData });
                const data = await response.json();
                
                await push(dbRef(db, 'articles_solaires'), { 
                    titre, 
                    prix: parseFloat(prix), 
                    categorie, 
                    imageUrl: data.data.url, 
                    dateAjout: new Date().toISOString()
                });

                document.getElementById('titre').value = ''; 
                document.getElementById('prix').value = '';
                document.getElementById('categorie').value = '';
                document.getElementById('image').value = '';
                
                const msg = document.getElementById('success-msg');
                msg.style.display = 'block';
                setTimeout(() => msg.style.display = 'none', 3000);
            } catch (e) { 
                alert("Error publishing item."); 
            }
            btn.innerText = "Publish Equipment";
            btn.disabled = false;
        });

        // Gestion des textes de la page d'accueil
        const textsRef = dbRef(db, 'contenu_pages/accueil');
        onValue(textsRef, (snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.val();
                document.getElementById('titre1').value = data.titre1 || "";
                document.getElementById('texte1').value = data.texte1 || "";
                document.getElementById('titre2').value = data.titre2 || "";
                document.getElementById('texte2').value = data.texte2 || "";
                document.getElementById('titre3').value = data.titre3 || "";
                document.getElementById('texte3').value = data.texte3 || "";
            }
        });

        document.getElementById('save-texts-btn').addEventListener('click', async () => {
            await update(textsRef, {
                titre1: document.getElementById('titre1').value,
                texte1: document.getElementById('texte1').value,
                titre2: document.getElementById('titre2').value,
                texte2: document.getElementById('texte2').value,
                titre3: document.getElementById('titre3').value,
                texte3: document.getElementById('texte3').value
            });
            const msg = document.getElementById('text-success-msg');
            msg.style.display = 'block';
            setTimeout(() => msg.style.display = 'none', 3000);
        });

        // Navigation & Footer Globaux
        const globalRef = dbRef(db, 'contenu_pages/global');
        onValue(globalRef, (snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.val();
                document.getElementById('nav-home').value = data.navHome || "";
                document.getElementById('nav-shop').value = data.navShop || "";
                document.getElementById('nav-about').value = data.navAbout || "";
                document.getElementById('footer-text').value = data.footerText || "";
            }
        });

        document.getElementById('save-global-btn').addEventListener('click', async () => {
            await update(globalRef, {
                navHome: document.getElementById('nav-home').value,
                navShop: document.getElementById('nav-shop').value,
                navAbout: document.getElementById('nav-about').value,
                footerText: document.getElementById('footer-text').value
            });
            const msg = document.getElementById('global-success-msg');
            msg.style.display = 'block';
            setTimeout(() => msg.style.display = 'none', 3000);
        });

        // Upload du Logo
        document.getElementById('save-logo-btn').addEventListener('click', async () => {
            const file = document.getElementById('logo-image-input').files[0];
            if (!file) return alert("Please select a logo image first!");
            
            const btn = document.getElementById('save-logo-btn');
            btn.innerText = "Uploading Logo...";
            try {
                const formData = new FormData(); formData.append("image", file);
                const response = await fetch("https://api.imgbb.com/1/upload?key=" + IMGBB_API_KEY, { method: "POST", body: formData });
                const data = await response.json();
                
                await update(globalRef, { logoUrl: data.data.url });
                alert("Logo updated successfully!");
            } catch (e) { alert("Error uploading logo."); }
            btn.innerText = "Upload New Logo";
        });

        // Upload de l'image de fond (Hero)
        document.getElementById('save-hero-img-btn').addEventListener('click', async () => {
            const file = document.getElementById('hero-image-input').files[0];
            if (!file) return alert("Please select a background image first!");
            
            const btn = document.getElementById('save-hero-img-btn');
            btn.innerText = "Uploading Background...";
            try {
                const formData = new FormData(); formData.append("image", file);
                const response = await fetch("https://api.imgbb.com/1/upload?key=" + IMGBB_API_KEY, { method: "POST", body: formData });
                const data = await response.json();
                
                await update(globalRef, { heroImage: data.data.url });
                alert("Background image updated successfully!");
            } catch (e) { alert("Error uploading background."); }
            btn.innerText = "Upload New Hero Background";
        });
    </script>
</body>
</html>
