<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - Boutique Solaire</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; padding: 30px; margin: 0; }
        .container { background-color: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; max-width: 600px; }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"], input[type="email"], input[type="password"], input[type="file"], textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: inherit; }
        button { width: 100%; padding: 10px; background-color: #e67e22; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        button:hover { background-color: #d35400; }
        .admin-item { display: flex; justify-content: space-between; align-items: center; background: #f9f9f9; padding: 10px; margin-bottom: 10px; border-radius: 4px; border: 1px solid #ddd; }
        .admin-item img { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; }
        .btn-delete { background-color: #e74c3c; width: auto; padding: 5px 15px; font-size: 14px; margin: 0; }
        .btn-delete:hover { background-color: #c0392b; }
        #dashboard-section { display: none; }
        .section-header { background-color: #333; color: white; padding: 10px; border-radius: 4px; margin-top: 40px; text-align: center; font-size: 18px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- SECTION 1 : CONNEXION -->
        <div id="login-section">
            <h2>Connexion Sécurisée</h2>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="email@client.com">
            </div>
            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>
            <button id="login-btn">Se connecter</button>
            <p id="login-error" style="color: red; text-align: center; display: none;">Identifiants incorrects.</p>
        </div>

        <!-- SECTION 2 : TABLEAU DE BORD -->
        <div id="dashboard-section">
            
            <div class="section-header">1. Gérer les articles de la boutique</div>
            
            <div class="form-group" style="margin-top: 20px;">
                <label>Titre de l'article</label>
                <input type="text" id="titre">
            </div>
            <div class="form-group">
                <label>Prix (FCFA)</label>
                <input type="number" id="prix">
            </div>
            <div class="form-group">
                <label>Image</label>
                <input type="file" id="image" accept="image/*">
            </div>
            <button id="add-item-btn">Publier l'article</button>
            <p id="success-msg" style="color: green; text-align: center; display: none;">Article publié !</p>

            <div id="admin-list" style="margin-top: 20px;"></div>

            <!-- NOUVELLE SECTION : GESTION DES TEXTES DU SITE -->
            <div class="section-header">2. Modifier les textes de l'Accueil</div>
            
            <div style="margin-top: 20px;">
                <div class="form-group">
                    <label>Titre 1</label>
                    <input type="text" id="titre1">
                    <label>Texte 1</label>
                    <textarea id="texte1" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>Titre 2</label>
                    <input type="text" id="titre2">
                    <label>Texte 2</label>
                    <textarea id="texte2" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>Titre 3</label>
                    <input type="text" id="titre3">
                    <label>Texte 3</label>
                    <textarea id="texte3" rows="3"></textarea>
                </div>
                <button id="save-texts-btn" style="background-color: #27ae60;">Mettre à jour le site</button>
                <p id="text-success-msg" style="color: green; text-align: center; display: none;">Textes mis à jour !</p>
            </div>

            <button id="logout-btn" style="background-color: #7f8c8d; margin-top: 40px;">Se déconnecter</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
        import { getDatabase, ref as dbRef, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA8CtduFC3q0j8SezpmTxCUSZbu-NBJeyM",
            authDomain: "k-big-solar-energie.firebaseapp.com",
            databaseURL: "https://k-big-solar-energie-default-rtdb.firebaseio.com",
            projectId: "k-big-solar-energie",
            storageBucket: "k-big-solar-energie.firebasestorage.app",
            messagingSenderId: "678658108783",
            appId: "1:678658108783:web:5ac94bc5f426db6e27cc9a"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const IMGBB_API_KEY = "fb18d4c248db51cf6f9af93c587808fa";

        const loginSection = document.getElementById('login-section');
        const dashboardSection = document.getElementById('dashboard-section');
        const loginBtn = document.getElementById('login-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const adminList = document.getElementById('admin-list');

        // Authentification
        loginBtn.addEventListener('click', () => {
            signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value)
                .then(() => {
                    loginSection.style.display = 'none';
                    dashboardSection.style.display = 'block';
                })
                .catch(() => document.getElementById('login-error').style.display = 'block');
        });

        logoutBtn.addEventListener('click', () => {
            signOut(auth).then(() => {
                loginSection.style.display = 'block';
                dashboardSection.style.display = 'none';
            });
        });

        // 1. GESTION DES ARTICLES
        onValue(dbRef(db, 'articles_solaires'), (snapshot) => {
            adminList.innerHTML = "";
            if (snapshot.exists()) {
                const data = snapshot.val();
                Object.keys(data).forEach((key) => {
                    const article = data[key];
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'admin-item';
                    itemDiv.innerHTML = `
                        <img src="${article.imageUrl}" alt="">
                        <span style="flex-grow: 1; margin: 0 15px;"><strong>${article.titre}</strong><br>${article.prix} FCFA</span>
                        <button class="btn-delete" data-id="${key}">X</button>
                    `;
                    adminList.appendChild(itemDiv);
                });

                document.querySelectorAll('.btn-delete').forEach(button => {
                    button.addEventListener('click', async (e) => {
                        if (confirm("Supprimer cet article ?")) {
                            await remove(dbRef(db, 'articles_solaires/' + e.target.getAttribute('data-id')));
                        }
                    });
                });
            }
        });

        document.getElementById('add-item-btn').addEventListener('click', async () => {
            const titre = document.getElementById('titre').value;
            const prix = document.getElementById('prix').value;
            const file = document.getElementById('image').files[0];
            if (!titre || !prix || !file) return alert("Remplissez tout !");
            
            document.getElementById('add-item-btn').innerText = "Envoi...";
            try {
                const formData = new FormData(); formData.append("image", file);
                const response = await fetch("https://api.imgbb.com/1/upload?key=" + IMGBB_API_KEY, { method: "POST", body: formData });
                const data = await response.json();
                
                await push(dbRef(db, 'articles_solaires'), { titre, prix: parseFloat(prix), imageUrl: data.data.url, dateAjout: new Date().toISOString() });
                
                document.getElementById('titre').value = ''; document.getElementById('prix').value = '';
                document.getElementById('success-msg').style.display = 'block';
                setTimeout(() => document.getElementById('success-msg').style.display = 'none', 3000);
            } catch (e) { alert("Erreur"); }
            document.getElementById('add-item-btn').innerText = "Publier l'article";
        });

        // 2. GESTION DES TEXTES DU SITE
        const textsRef = dbRef(db, 'contenu_pages/accueil');
        
        // Charger les textes existants dans les champs
        onValue(textsRef, (snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.val();
                document.getElementById('titre1').value = data.titre1 || "Welcome to K.BIG Solar Energy";
                document.getElementById('texte1').value = data.texte1 || "K.BIG Solar Energy is dedicated...";
                document.getElementById('titre2').value = data.titre2 || "Your Life with Clean Energy";
                document.getElementById('texte2').value = data.texte2 || "Discover quality solar products...";
                document.getElementById('titre3').value = data.titre3 || "Why Choose K.BIG Solar Energy?";
                document.getElementById('texte3').value = data.texte3 || "We offer quality products...";
            }
        });

        // Sauvegarder les modifications
        document.getElementById('save-texts-btn').addEventListener('click', async () => {
            await update(textsRef, {
                titre1: document.getElementById('titre1').value,
                texte1: document.getElementById('texte1').value,
                titre2: document.getElementById('titre2').value,
                texte2: document.getElementById('texte2').value,
                titre3: document.getElementById('titre3').value,
                texte3: document.getElementById('texte3').value
            });
            document.getElementById('text-success-msg').style.display = 'block';
            setTimeout(() => document.getElementById('text-success-msg').style.display = 'none', 3000);
        });
    </script>
</body>
</html>
