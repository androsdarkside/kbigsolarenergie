<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-Big Solar Energie - Boutique</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        header { text-align: center; margin-bottom: 40px; }
        h1 { color: #2c3e50; }
        .grid { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
        .card { background: white; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 280px; padding: 15px; text-align: center; }
        .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 4px; }
        .card h3 { color: #333; margin: 15px 0 10px; }
        .card p { color: #e67e22; font-weight: bold; font-size: 18px; }
        .no-articles { text-align: center; color: #7f8c8d; font-size: 18px; margin-top: 50px; }
    </style>
</head>
<body>

    <header>
        <h1>K-Big Solar Energie</h1>
        <p>Vos équipements solaires de qualité au meilleur prix</p>
    </header>

    <div id="articles-container" class="grid">
        <!-- Les articles s'afficheront ici automatiquement -->
    </div>

    <p id="loading" class="no-articles">Chargement des équipements...</p>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

        // Ta configuration Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyA8CtduFC3q0j8SezpmTxCUSZbu-NBJeyM",
            authDomain: "k-big-solar-energie.firebaseapp.com",
            databaseURL: "https://k-big-solar-energie-default-rtdb.firebaseio.com",
            projectId: "k-big-solar-energie",
            storageBucket: "k-big-solar-energie.firebasestorage.app",
            messagingSenderId: "678658108783",
            appId: "1:678658108783:web:5ac94bc5f426db6e27cc9a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const container = document.getElementById('articles-container');
        const loading = document.getElementById('loading');

        // Écoute en temps réel de la Realtime Database
        const articlesRef = ref(db, 'articles_solaires');
        
        onValue(articlesRef, (snapshot) => {
            container.innerHTML = "";
            loading.style.display = 'none';

            if (snapshot.exists()) {
                const data = snapshot.val();
                
                // Parcourir chaque article enregistré
                Object.keys(data).forEach((key) => {
                    const article = data[key];

                    // Création de la carte produit
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <img src="${article.imageUrl}" alt="${article.titre}">
                        <h3>${article.titre}</h3>
                        <p>${article.prix} FCFA</p>
                    `;
                    container.appendChild(card);
                });
            } else {
                container.innerHTML = '<p class="no-articles">Aucun équipement disponible pour le moment.</p>';
            }
        });
    </script>
</body>
</html>
