<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop - K.BIG Solar Energy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo"> 
    <img src="logo.jpg" alt="K.BIG Solar Logo" id="dyn-logo"> 
</div>
        <nav class="menu">
            <a href="index.html" id="dyn-nav-home">Home</a>
            <a href="shop.html" id="dyn-nav-shop" style="color: #ff5100;">Shop</a>
            <a href="index.html#about" id="dyn-nav-about">About</a>
            <a href="shop.html" class="btn-menu">View Offers</a> 
        </nav>
    </header>

    <div class="shop-container">
        <h1 class="section-title">Our Solar Equipment</h1>
        
        <div id="articles-container" class="grid">
            <!-- Injected by Javascript -->
        </div>
        <p id="loading" style="text-align: center; color: #64748b; font-size: 1.2rem; margin-top: 50px;">Loading catalog...</p>
    </div>

    <footer>
        <p id="dyn-footer">© 2026 K.BIG SOLAR ENERGY</p>
    </footer>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA8CtduFC3q0j8SezpmTxCUSZbu-NBJeyM",
            authDomain: "k-big-solar-energie.firebaseapp.com",
            databaseURL: "https://k-big-solar-energie-default-rtdb.firebaseio.com",
            projectId: "k-big-solar-energie"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const container = document.getElementById('articles-container');
        const loading = document.getElementById('loading');
        
        onValue(ref(db, 'articles_solaires'), (snapshot) => {
            container.innerHTML = "";
            loading.style.display = 'none';

            if (snapshot.exists()) {
                const data = snapshot.val();
                const categories = {};

                // 1. Trier les articles dans leurs catégories
                Object.keys(data).forEach(key => {
                    const article = data[key];
                    const cat = article.categorie || "Other Equipment";
                    if(!categories[cat]) categories[cat] = [];
                    categories[cat].push(article);
                });

                // 2. Créer visuellement les sections
                Object.keys(categories).forEach(cat => {
                    // Traduction automatique des catégories saisies en français dans l'admin
                    let catName = cat;
                    if (cat === "Panneaux Solaires") catName = "Solar Panels";
                    if (cat === "Onduleurs Hybrides") catName = "Hybrid Inverters";
                    if (cat === "Batteries") catName = "Storage Batteries";
                    if (cat === "Accessoires") catName = "Accessories & Cables";
                    if (cat === "Autres") catName = "Other Equipment";

                    // Création du titre de la section (avec la correction "grid-column" intégrée)
                    const titreSection = document.createElement('h2');
                    titreSection.innerText = catName;
                    titreSection.style.cssText = "grid-column: 1 / -1; width: 100%; margin: 50px 0 20px; font-size: 2rem; color: #0f172a; border-bottom: 2px solid #ff5100; padding-bottom: 10px;";
                    container.appendChild(titreSection);

                    // Ajout des cartes sous le titre
                    categories[cat].forEach(article => {
                        const card = document.createElement('div');
                        card.className = 'card';
                        
                        // Ton numéro WhatsApp (idéal pour le marché local avec le +233)
                        const numeroWhatsApp = "233241913309"; 
                        
                        // Formatage du prix pour plus de lisibilité (ex: 150 000 FCFA)
                        const formattedPrice = Number(article.prix).toLocaleString('fr-FR');

                        // Création du message pré-rempli en anglais
                        const message = encodeURIComponent(`Hello, I would like to order: ${article.titre} at the price of ${formattedPrice} FCFA.`);
                        const lienWhatsApp = `https://wa.me/${numeroWhatsApp}?text=${message}`;

                        card.innerHTML = `
                            <img src="${article.imageUrl}" alt="${article.titre}">
                            <h3>${article.titre}</h3>
                            <div class="price-row">
                                <span class="price">${formattedPrice} GHS </span>
                                <a href="${lienWhatsApp}" target="_blank" class="btn-card" style="background-color: #25D366; color: white;">Order</a>
                            </div>
                        `;
                        container.appendChild(card);
                    });
                });
            } else {
                // Correction grid-column ici aussi pour centrer le message
                container.innerHTML = '<p style="text-align: center; width: 100%; grid-column: 1 / -1;">No equipment available yet.</p>';
            }
        });

        // Écoute des éléments globaux (Menu et Footer)
        onValue(ref(db, 'contenu_pages/global'), (snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.val();
                if(data.navHome) document.getElementById('dyn-nav-home').innerText = data.navHome;
                if(data.navShop) document.getElementById('dyn-nav-shop').innerText = data.navShop;
                if(data.navAbout) document.getElementById('dyn-nav-about').innerText = data.navAbout;
                if(data.footerText) document.getElementById('dyn-footer').innerText = data.footerText;
            if(data.heroImage) {
                    document.querySelector('.hero').style.backgroundImage = `linear-gradient(rgba(15, 23, 42, 0.8), rgba(15, 23, 42, 0.8)), url('${data.heroImage}')`;
                }
                         if(data.logoUrl) {
    document.getElementById('dyn-logo').src = data.logoUrl;
}
            }
            
          });
    </script>
</body>
</html>
