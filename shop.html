<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boutique - K.BIG Solar Energy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo"> 
            <img src="logo.jpg" alt="Logo K.BIG Solar"> 
        </div>
        <nav class="menu">
            <a href="index.html">Accueil</a>
            <a href="shop.html" style="color: #ff5100;">Boutique</a>
            <a href="index.html#about">À propos</a>
        </nav>
    </header>

    <div class="shop-container">
        <h1 class="section-title">Nos Équipements Solaires</h1>
        
        <div id="articles-container" class="grid">
            <!-- Injecté par Javascript -->
        </div>
        <p id="loading" style="text-align: center; color: #64748b; font-size: 1.2rem; margin-top: 50px;">Chargement du catalogue...</p>
    </div>

    <footer>
        <p>© 2026 K.BIG SOLAR ENERGY · Tous droits réservés</p>
    </footer>

    <!-- Script Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA8CtduFC3q0j8SezpmTxCUSZbu-NBJeyM",
            authDomain: "k-big-solar-energie.firebaseapp.com",
            databaseURL: "https://k-big-solar-energie-default-rtdb.firebaseio.com",
            projectId: "k-big-solar-energie"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const container = document.getElementById('articles-container');
        const loading = document.getElementById('loading');
        
        onValue(ref(db, 'articles_solaires'), (snapshot) => {
    container.innerHTML = "";
    loading.style.display = 'none';

    if (snapshot.exists()) {
        const data = snapshot.val();
        const categories = {};

        // 1. Trier les articles dans leurs catégories respectives
        Object.keys(data).forEach(key => {
            const article = data[key];
            const cat = article.categorie || "Autres";
            if(!categories[cat]) categories[cat] = [];
            categories[cat].push(article);
        });

        // 2. Créer visuellement les sections
        Object.keys(categories).forEach(cat => {
            // Création du titre de la section
            const titreSection = document.createElement('h2');
            titreSection.innerText = cat;
            titreSection.style.cssText = "width: 100%; margin: 50px 0 20px; font-size: 2rem; color: #0f172a; border-bottom: 2px solid #ff5100; padding-bottom: 10px;";
            container.appendChild(titreSection);

            // Ajout des cartes sous le titre
            categories[cat].forEach(article => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${article.imageUrl}" alt="${article.titre}">
                    <h3>${article.titre}</h3>
                    <div class="price-row">
                        <span class="price">${article.prix} FCFA</span>
                        <a href="#" class="btn-card">Commander</a>
                    </div>
                `;
                container.appendChild(card);
            });
        });
    } else {
        container.innerHTML = '<p style="text-align: center; width: 100%;">Aucun équipement disponible.</p>';
    }
});
    </script>
</body>
</html>
