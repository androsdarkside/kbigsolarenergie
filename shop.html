<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipment Shop - K.BIG Solar Energy</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff5100;
            --primary-hover: #e64a00;
            --bg-light: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --white: #ffffff;
            --border: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-main);
        }

        nav {
            background-color: var(--white);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo img {
            height: 45px;
            object-fit: contain;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-main);
            font-weight: 600;
            font-size: 1rem;
        }

        .cart-btn {
            background: #fff3ec;
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 10px 18px;
            border-radius: 30px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cart-badge {
            background: var(--primary);
            color: var(--white);
            font-size: 0.75rem;
            padding: 2px 7px;
            border-radius: 50px;
        }

        .shop-header {
            background-color: #0f172a;
            color: var(--white);
            padding: 60px 5%;
            text-align: center;
        }

        .shop-header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .shop-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* Search & Filters */
        .controls-bar {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 40px;
        }

        .search-input {
            width: 100%;
            padding: 16px 20px;
            border: 1px solid var(--border);
            border-radius: 14px;
            font-size: 1rem;
            outline: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }

        .filter-pills {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .pill {
            padding: 10px 20px;
            border-radius: 30px;
            background: var(--white);
            border: 1px solid var(--border);
            color: var(--text-muted);
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .pill.active {
            background: var(--primary);
            color: var(--white);
            border-color: var(--primary);
        }

        /* Products Grid */
        .grid-products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
            gap: 25px;
        }

        .product-card {
            background: var(--white);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .product-image {
            width: 100%;
            height: 190px;
            object-fit: contain;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .product-category {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--primary);
            text-transform: uppercase;
        }

        .product-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin: 6px 0;
        }

        .product-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .product-price {
            font-size: 1.3rem;
            font-weight: 800;
            margin-bottom: 15px;
        }

        .btn-add-cart {
            width: 100%;
            background-color: var(--primary);
            color: var(--white);
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        /* Cart Drawer */
        .cart-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            z-index: 200;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .cart-overlay.active { opacity: 1; visibility: visible; }

        .cart-drawer {
            position: fixed;
            top: 0; right: 0;
            width: 100%; max-width: 420px; height: 100%;
            background: var(--white);
            z-index: 201;
            transform: translateX(100%);
            transition: transform 0.3s;
            display: flex;
            flex-direction: column;
        }

        .cart-overlay.active .cart-drawer { transform: translateX(0); }

        .cart-header { padding: 20px 25px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
        .cart-items-body { flex-grow: 1; overflow-y: auto; padding: 20px 25px; display: flex; flex-direction: column; gap: 15px; }
        .cart-footer { padding: 20px 25px; border-top: 1px solid var(--border); background: var(--bg-light); }

        .cart-item { display: flex; gap: 15px; align-items: center; padding-bottom: 15px; border-bottom: 1px solid var(--border); }
        .cart-item img { width: 60px; height: 60px; object-fit: contain; }
        .cart-qty-controls { display: flex; gap: 8px; align-items: center; margin-top: 4px; }
        .qty-btn { width: 24px; height: 24px; border: 1px solid var(--border); cursor: pointer; }

        footer { background-color: #0f172a; color: #94a3b8; text-align: center; padding: 30px; margin-top: 80px; }
    </style>
</head>
<body>

    <nav>
        <div class="logo">
            <img id="nav-logo" src="https://via.placeholder.com/150x50?text=K.BIG+Solar" alt="K.BIG Solar">
        </div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="shop.html" style="color: var(--primary);">Shop</a>
            <button class="cart-btn" id="open-cart-btn">
                🛒 Cart <span class="cart-badge" id="cart-count">0</span>
            </button>
        </div>
    </nav>

    <div class="shop-header">
        <h1>Solar Equipment Catalog</h1>
        <p>Explore panels, hybrid inverters, batteries & cabling solutions</p>
    </div>

    <div class="shop-container">
        <div class="controls-bar">
            <input type="text" id="searchInput" class="search-input" placeholder="Search equipment by title or keyword...">
            
            <div class="filter-pills">
                <button class="pill active" data-cat="ALL">All Categories</button>
                <button class="pill" data-cat="Solar Panels">Solar Panels</button>
                <button class="pill" data-cat="Hybrid Inverters">Hybrid Inverters</button>
                <button class="pill" data-cat="Storage Batteries">Storage Batteries</button>
                <button class="pill" data-cat="Accessories & Cables">Accessories & Cables</button>
            </div>
        </div>

        <div class="grid-products" id="shop-grid"></div>
    </div>

    <!-- Cart Drawer -->
    <div class="cart-overlay" id="cart-overlay">
        <div class="cart-drawer">
            <div class="cart-header">
                <h3>Your Shopping Cart</h3>
                <button style="background:none; border:none; font-size:1.5rem; cursor:pointer;" id="close-cart-btn">✕</button>
            </div>
            <div class="cart-items-body" id="cart-items-list"></div>
            <div class="cart-footer">
                <div style="display:flex; justify-content:space-between; font-weight:800; font-size:1.1rem; margin-bottom:15px;">
                    <span>Total Amount:</span>
                    <span id="cart-total-price">0 GHS</span>
                </div>
                <button style="width:100%; background:#25D366; color:white; border:none; padding:14px; border-radius:12px; font-weight:700; cursor:pointer;" id="whatsapp-checkout-btn">
                    💬 Order via WhatsApp
                </button>
            </div>
        </div>
    </div>

    <footer>
        <p id="footer-text">© 2026 K.BIG Solar Energy. All rights reserved.</p>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getDatabase, ref as dbRef, onValue } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA8CtduFC3q0j8SezpmTxCUSZbu-NBJeyM",
            authDomain: "k-big-solar-energie.firebaseapp.com",
            databaseURL: "https://k-big-solar-energie-default-rtdb.firebaseio.com",
            projectId: "k-big-solar-energie",
            storageBucket: "k-big-solar-energie.firebasestorage.app",
            messagingSenderId: "678658108783",
            appId: "1:678658108783:web:5ac94bc5f426db6e27cc9a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let allProducts = [];
        let activeCategory = "ALL";
        let cart = JSON.parse(localStorage.getItem('kbig_solar_cart')) || [];

        function saveCart() {
            localStorage.setItem('kbig_solar_cart', JSON.stringify(cart));
            updateCartUI();
        }

        function translateCategory(cat) {
            if (cat === "Panneaux Solaires") return "Solar Panels";
            if (cat === "Onduleurs Hybrides") return "Hybrid Inverters";
            if (cat === "Batteries") return "Storage Batteries";
            if (cat === "Accessoires") return "Accessories & Cables";
            return cat || "Equipment";
        }

        function renderProducts() {
            const grid = document.getElementById('shop-grid');
            const search = document.getElementById('searchInput').value.toLowerCase();

            const filtered = allProducts.filter(p => {
                const translated = translateCategory(p.categorie);
                const matchCat = activeCategory === "ALL" || translated === activeCategory;
                const matchSearch = p.titre.toLowerCase().includes(search) || translated.toLowerCase().includes(search);
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align:center; color: var(--text-muted);">No products match your criteria.</p>`;
                return;
            }

            grid.innerHTML = "";
            filtered.forEach(p => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div>
                        <img class="product-image" src="${p.imageUrl}" alt="${p.titre}">
                        <span class="product-category">${translateCategory(p.categorie)}</span>
                        <h3 class="product-title">${p.titre}</h3>
                        <p class="product-desc">${p.description || "High efficiency solar unit built for long term energy performance."}</p>
                        <div class="product-price">${Number(p.prix).toLocaleString('en-US')} GHS</div>
                    </div>
                    <button class="btn-add-cart" data-id="${p.id}">+ Add to Cart</button>
                `;
                grid.appendChild(card);
            });

            document.querySelectorAll('.btn-add-cart').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = e.target.getAttribute('data-id');
                    const prod = allProducts.find(p => p.id === id);
                    if (prod) {
                        const existing = cart.find(item => item.id === prod.id);
                        if (existing) existing.quantity += 1;
                        else cart.push({ ...prod, quantity: 1 });
                        saveCart();
                        openCart();
                    }
                });
            });
        }

        function updateCartUI() {
            const cartCountBadge = document.getElementById('cart-count');
            const cartItemsList = document.getElementById('cart-items-list');
            const cartTotalPrice = document.getElementById('cart-total-price');

            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            cartCountBadge.innerText = totalItems;

            if (cart.length === 0) {
                cartItemsList.innerHTML = `<p style="text-align: center; color: var(--text-muted); margin-top: 40px;">Your cart is empty.</p>`;
                cartTotalPrice.innerText = "0 GHS";
                return;
            }

            cartItemsList.innerHTML = "";
            let grandTotal = 0;

            cart.forEach((item, index) => {
                const sub = item.prix * item.quantity;
                grandTotal += sub;
                const div = document.createElement('div');
                div.className = 'cart-item';
                div.innerHTML = `
                    <img src="${item.imageUrl}" alt="${item.titre}">
                    <div style="flex-grow:1;">
                        <div style="font-weight:700; font-size:0.9rem;">${item.titre}</div>
                        <div style="color:var(--primary); font-weight:800;">${Number(item.prix).toLocaleString('en-US')} GHS</div>
                        <div class="cart-qty-controls">
                            <button class="qty-btn btn-minus" data-idx="${index}">-</button>
                            <span style="font-size:0.85rem; font-weight:700;">${item.quantity}</span>
                            <button class="qty-btn btn-plus" data-idx="${index}">+</button>
                        </div>
                    </div>
                    <button style="color:#ef4444; background:none; border:none; cursor:pointer;" class="btn-del" data-idx="${index}">🗑️</button>
                `;
                cartItemsList.appendChild(div);
            });

            cartTotalPrice.innerText = `${grandTotal.toLocaleString('en-US')} GHS`;

            document.querySelectorAll('.btn-minus').forEach(b => b.onclick = (e) => {
                const idx = e.target.getAttribute('data-idx');
                if (cart[idx].quantity > 1) cart[idx].quantity -= 1;
                else cart.splice(idx, 1);
                saveCart();
            });
            document.querySelectorAll('.btn-plus').forEach(b => b.onclick = (e) => {
                const idx = e.target.getAttribute('data-idx');
                cart[idx].quantity += 1;
                saveCart();
            });
            document.querySelectorAll('.btn-del').forEach(b => b.onclick = (e) => {
                cart.splice(e.target.getAttribute('data-idx'), 1);
                saveCart();
            });
        }

        const overlay = document.getElementById('cart-overlay');
        function openCart() { overlay.classList.add('active'); }
        function closeCart() { overlay.classList.remove('active'); }

        document.getElementById('open-cart-btn').onclick = openCart;
        document.getElementById('close-cart-btn').onclick = closeCart;
        overlay.onclick = (e) => { if (e.target === overlay) closeCart(); };

        document.getElementById('whatsapp-checkout-btn').onclick = () => {
            if (cart.length === 0) return alert("Your cart is empty!");
            let msg = "Hello K.BIG Solar Energy! I want to order:\n\n";
            let tot = 0;
            cart.forEach(i => {
                const sub = i.prix * i.quantity;
                tot += sub;
                msg += `• *${i.titre}* x${i.quantity} - ${sub.toLocaleString('en-US')} GHS\n`;
            });
            msg += `\n*Total Amount:* ${tot.toLocaleString('en-US')} GHS`;
            window.open(`https://wa.me/233000000000?text=${encodeURIComponent(msg)}`, '_blank');
        };

        // Filter events
        document.querySelectorAll('.pill').forEach(pill => {
            pill.addEventListener('click', (e) => {
                document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
                e.target.classList.add('active');
                activeCategory = e.target.getAttribute('data-cat');
                renderProducts();
            });
        });

        document.getElementById('searchInput').addEventListener('input', renderProducts);

        onValue(dbRef(db, 'articles_solaires'), (snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.val();
                allProducts = Object.keys(data).map(key => ({ id: key, ...data[key] }));
                renderProducts();
            }
        });

        onValue(dbRef(db, 'contenu_pages/global'), (snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.val();
                if (data.logoUrl) document.getElementById('nav-logo').src = data.logoUrl;
                if (data.footerText) document.getElementById('footer-text').innerText = data.footerText;
            }
        });

        updateCartUI();
    </script>
</body>
</html>
